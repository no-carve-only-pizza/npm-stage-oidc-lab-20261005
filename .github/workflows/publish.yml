name: OIDC stage approval boundary check

on:
  workflow_dispatch:
    inputs:
      stage_id:
        description: Owned synthetic stage UUID
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  approve-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: node scripts/check-stage-approve.mjs
        env:
          STAGE_ID: ${{ inputs.stage_id }}
