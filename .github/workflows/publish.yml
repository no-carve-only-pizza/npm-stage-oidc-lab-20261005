name: OIDC restricted dist-tag check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  dist-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - run: npm dist-tag add @dohyunpkr/stage-publish-example@0.0.1 stage-oidc-probe
