name: OIDC staged version immutability check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  stage-variant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - run: npm stage publish --access public --tag latest --force
